<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes Jeux - LaserOnWood</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .hero-section {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 60px 0;
            margin-bottom: 40px;
            border-radius: 0 0 20px 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .game-card {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border: none;
            border-radius: 15px;
            overflow: hidden;
            height: 100%;
        }
        .game-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
        }
        .game-icon {
            font-size: 3rem;
            color: #764ba2;
            margin-bottom: 15px;
        }
        .btn-play {
            background-color: #764ba2;
            color: white;
            border-radius: 25px;
            padding: 8px 25px;
            transition: all 0.3s;
        }
        .btn-play:hover {
            background-color: #5a3a7d;
            color: white;
            transform: scale(1.05);
        }
        #games-container {
            min-height: 300px;
        }
        .loading-spinner {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 200px;
        }
    </style>
</head>
<body>

    <header class="hero-section text-center">
        <div class="container">
            <h1 class="display-4 fw-bold"><i class="fas fa-gamepad me-3"></i>Bibliothèque de Jeux</h1>
            <p class="lead">Découvrez toutes mes créations interactives</p>
        </div>
    </header>

    <main class="container mb-5">
        <div id="games-container" class="row g-4">
            <!-- Les jeux seront injectés ici par JavaScript -->
            <div class="loading-spinner w-100">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Chargement...</span>
                </div>
            </div>
        </div>
    </main>

    <footer class="text-center py-4 text-muted">
        <div class="container">
            <p>&copy; 2026 LaserOnWood - Tous droits réservés</p>
        </div>
    </footer>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('games-container');

            // Charger les données depuis le fichier JSON
            fetch('games.json')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Erreur lors du chargement des jeux');
                    }
                    return response.json();
                })
                .then(games => {
                    container.innerHTML = ''; // Vider le spinner
                    
                    if (games.length === 0) {
                        container.innerHTML = '<div class="col-12 text-center"><p class="alert alert-info">Aucun jeu trouvé pour le moment.</p></div>';
                        return;
                    }

                    games.forEach(game => {
                        const gameCol = document.createElement('div');
                        gameCol.className = 'col-12 col-md-6 col-lg-4 col-xl-3';
                        
                        gameCol.innerHTML = `
                            <div class="card game-card shadow-sm">
                                <div class="card-body text-center p-4">
                                    <div class="game-icon">
                                        <i class="fas fa-rocket"></i>
                                    </div>
                                    <h5 class="card-title fw-bold text-capitalize">${game.name}</h5>
                                    <p class="card-text text-muted small mb-4">${game.description || 'Cliquez pour jouer à ce jeu.'}</p>
                                    <a href="${game.path}" class="btn btn-play">
                                        Jouer <i class="fas fa-play ms-2"></i>
                                    </a>
                                </div>
                            </div>
                        `;
                        container.appendChild(gameCol);
                    });
                })
                .catch(error => {
                    console.error('Erreur:', error);
                    container.innerHTML = `
                        <div class="col-12 text-center">
                            <div class="alert alert-danger">
                                <i class="fas fa-exclamation-triangle me-2"></i>
                                Impossible de charger la liste des jeux. Veuillez réessayer plus tard.
                            </div>
                        </div>
                    `;
                });
        });
    </script>
</body>
</html>
